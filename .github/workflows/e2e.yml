name: Live E2E

# Real calls into the test accounts of amoCRM, Kommo, Bitrix24 and Zoho CRM, and into a fresh
# Odoo Community started next to the job. One run at a time: the accounts are shared.
on:
  push:
    branches: [main]
    # a push of documents only changes nothing these jobs check, and the voice job pays for its minutes
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # one run at a time in the shared accounts; pull requests from forks (their job is skipped) get a
  # group of their own, so they cannot push a waiting run of main out of the queue
  group: >-
    live-e2e${{ github.event_name == 'pull_request' &&
    github.event.pull_request.head.repo.full_name != github.repository &&
    format('-fork-{0}', github.ref) || '' }}
  cancel-in-progress: false

jobs:
  e2e:
    name: Live E2E in five CRMs
    # secrets never reach pull requests from forks
    # and Dependabot pull requests get no Actions secrets: their dependency bump is tested by CI
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      odoo-db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U odoo -d postgres"
          --health-interval 3s --health-timeout 3s --health-retries 20
      odoo:
        image: odoo:19.0-20261102
        env:
          HOST: odoo-db
          USER: odoo
          PASSWORD: odoo
        ports: ["8069:8069"]
    # secrets only in the env of the step that runs the tests: checkout, setup-uv and the build scripts
    # of ``uv sync`` never see them
    env:
      E2E_REQUIRE_ALL: "1"
      ODOO_URL: http://127.0.0.1:8069
      ODOO_DB: e2e
      ODOO_LOGIN: admin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: Odoo password for this run
        run: |
          pw=$(openssl rand -hex 16)
          echo "::add-mask::$pw"
          echo "ODOO_PASSWORD=$pw" >> "$GITHUB_ENV"
      - name: Bootstrap the test Odoo
        run: uv run python scripts/odoo_bootstrap.py --url "$ODOO_URL" --db "$ODOO_DB" --password "$ODOO_PASSWORD" --wait 300
      - name: Live E2E
        # short tracebacks: no frame arguments (request headers) in the log
        run: uv run --frozen --no-sync pytest -m e2e -v --tb=short -p no:cacheprovider
        env:
          AMOCRM_DOMAIN: ${{ secrets.AMOCRM_DOMAIN }}
          AMOCRM_TOKEN: ${{ secrets.AMOCRM_TOKEN }}
          KOMMO_DOMAIN: ${{ secrets.KOMMO_DOMAIN }}
          KOMMO_TOKEN: ${{ secrets.KOMMO_TOKEN }}
          B24_WEBHOOK: ${{ secrets.B24_WEBHOOK }}
          ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}

  quality:
    name: Order to deal on the reference set (live model)
    # nightly and on main: the model behind the page may change without a commit of ours
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: Reference set against the bar of the page
        # short tracebacks: no frame arguments in the log
        run: uv run --frozen --no-sync pytest -m quality -v -s --tb=short -p no:cacheprovider apps/order-to-deal/tests/test_quality.py
        env:
          ANTHROPIC_OAUTH_TOKEN: ${{ secrets.ANTHROPIC_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  voice-quality:
    name: Voice to CRM on the reference set (live speech and model)
    # on main and by hand, not nightly: a run hears 165 s of audio, which the ElevenLabs plan counts
    # against the same monthly credits as its speech synthesis
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: Reference set against the bar of CI
        # short tracebacks: no frame arguments in the log
        run: uv run --frozen --no-sync pytest -m quality -v -s --tb=short -p no:cacheprovider apps/voice-to-crm/tests/test_quality.py
        env:
          ANTHROPIC_OAUTH_TOKEN: ${{ secrets.ANTHROPIC_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}

  contracts-quality:
    name: Contract check on the reference set (live model)
    # on main (not for a push of documents only, see paths-ignore above) and by hand: four pairs, 44 changes,
    # one scan; about $0.17 a run
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: Reference set against the bar of CI
        # short tracebacks: no frame arguments in the log
        run: uv run --frozen --no-sync pytest -m quality -v -s --tb=short -p no:cacheprovider apps/contract-check/tests/test_quality.py
        env:
          ANTHROPIC_OAUTH_TOKEN: ${{ secrets.ANTHROPIC_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  mail-quality:
    name: Mail triage on the reference set (live model)
    # on main (not for a push of documents only, see paths-ignore above) and by hand: 31 letters in Russian,
    # English and Uzbek, four with an injection; about $0.48 a run
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: Reference set against the bar of CI
        # short tracebacks: no frame arguments in the log
        run: uv run --frozen --no-sync pytest -m quality -v -s --tb=short -p no:cacheprovider apps/mail-triage/tests/test_quality.py
        env:
          ANTHROPIC_OAUTH_TOKEN: ${{ secrets.ANTHROPIC_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

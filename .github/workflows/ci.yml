name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # a newer push to a pull request replaces its run; runs on main finish (they deploy production)
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint, types, security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: ruff
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .
      - name: mypy --strict
        run: uv run mypy packages apps/order-to-deal/src apps/voice-to-crm/src apps/contract-check/src apps/mail-triage/src apps/win-back/src
      - name: bandit
        run: uv run bandit -c pyproject.toml -r packages apps/order-to-deal/src apps/voice-to-crm/src apps/contract-check/src apps/mail-triage/src apps/win-back/src scripts -q
      - name: pip-audit
        run: |
          uv export --frozen --no-emit-workspace --no-hashes --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          uv run pip-audit --strict --disable-pip --no-deps -r "$RUNNER_TEMP/requirements.txt"

  test:
    name: Unit and contract tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: alnuzum
          POSTGRES_PASSWORD: alnuzum-ci
          POSTGRES_DB: alnuzum
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U alnuzum -d alnuzum"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://alnuzum:alnuzum-ci@localhost:5432/alnuzum
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: pytest (coverage gate 90 %)
        run: uv run pytest --cov --cov-report=term --cov-fail-under=90

  compose:
    name: docker compose up, /health
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose up -d --build --wait
      - name: /health answers 200
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8040/health || true)
            [ "$code" = 200 ] && exit 0
            sleep 2
          done
          docker compose logs platform
          exit 1
      - name: the image carries the solutions
        run: |
          docker compose exec -T platform python -c "from alnuzum_platform.solutions import discover; s = [x.slug for x in discover()]; print(s); assert s == ['contracts', 'mail', 'orders', 'voice', 'winback'], s"
      - if: always()
        run: docker compose down -v

  gitleaks:
    name: Secrets in the whole history
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        env:
          VERSION: 8.30.1
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfL -o checksums.txt "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_checksums.txt"
          grep " gitleaks_${VERSION}_linux_x64.tar.gz\$" checksums.txt | sed 's/gitleaks_.*$/gitleaks.tgz/' | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          mv gitleaks "$RUNNER_TEMP/gitleaks"
      - name: The rules catch planted secrets
        run: |
          planted="$RUNNER_TEMP/planted"; mkdir -p "$planted"
          python3 - "$planted" <<'PY'
          import secrets, string, sys
          a = string.ascii_letters + string.digits
          key = "".join(secrets.choice(a) for _ in range(16))
          open(f"{sys.argv[1]}/hook.txt", "w").write(f"https://acme.bitrix24.ru/rest/1/{key}/\n")
          open(f"{sys.argv[1]}/zoho.txt", "w").write(f"1000.{secrets.token_hex(16)}.{secrets.token_hex(16)}\n")
          PY
          if "$RUNNER_TEMP/gitleaks" dir --no-banner --config .gitleaks.toml --report-format json --report-path "$RUNNER_TEMP/planted.json" "$planted"; then
            echo "planted secrets were not found"; exit 1
          fi
          test "$(jq -r '[.[].RuleID] | sort | join(",")' "$RUNNER_TEMP/planted.json")" = "bitrix24-inbound-webhook,zoho-oauth-token"
      - name: gitleaks over the whole history
        env:
          # hosts of the test accounts must never reach the repository; secrets, so the log masks them
          HOSTS: ${{ secrets.AMOCRM_DOMAIN }} ${{ secrets.KOMMO_DOMAIN }} ${{ secrets.B24_HOST }}
        run: |
          python3 - <<'PY'
          import os, re
          words = sorted({re.escape(h.split(".")[0]) for h in os.environ["HOSTS"].split() if h})
          cfg = f'[extend]\npath = "{os.environ["GITHUB_WORKSPACE"]}/.gitleaks.toml"\n'
          if words:
              cfg += '\n[[rules]]\nid = "test-account-host"\ndescription = "host of a test CRM account"\n'
              cfg += "regex = '''(?i)\\b(" + "|".join(words) + ")\\b'''\n"
          open(os.environ["RUNNER_TEMP"] + "/gitleaks-ci.toml", "w").write(cfg)
          PY
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --config "$RUNNER_TEMP/gitleaks-ci.toml" --log-opts="--all" .

  # The image of this commit goes to the server only after every job of the gate is green.
  deploy-stand:
    name: Deploy to the stand
    needs: [lint, test, compose, gitleaks]
    # pull requests from this repository only: forks and Dependabot get no secrets
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: stand
      url: https://apps-stand.alnuzum.com
    concurrency:
      group: deploy-stand
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build, ship, start
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SECRET_KEYS: ${{ secrets.SECRET_KEYS }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          KOMMO_CLIENT_ID: ${{ vars.KOMMO_CLIENT_ID }}
          KOMMO_CLIENT_SECRET: ${{ secrets.KOMMO_CLIENT_SECRET }}
          ZOHO_CLIENT_ID: ${{ vars.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
          QUOTA_WRITES_PER_DAY: ${{ vars.QUOTA_WRITES_PER_DAY }}
          ANTHROPIC_OAUTH_TOKEN: ${{ secrets.ANTHROPIC_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ORDERS_MODEL_USD_PER_DAY: ${{ vars.ORDERS_MODEL_USD_PER_DAY }}
          ORDERS_MODEL_CALLS_PER_DAY: ${{ vars.ORDERS_MODEL_CALLS_PER_DAY }}
          ORDERS_RUNS_PER_SESSION: ${{ vars.ORDERS_RUNS_PER_SESSION }}
          ORDERS_RUNS_PER_IP: ${{ vars.ORDERS_RUNS_PER_IP }}
          ORDERS_DEMO_WRITES_PER_SESSION: ${{ vars.ORDERS_DEMO_WRITES_PER_SESSION }}
          DEMO_AMOCRM_DOMAIN: ${{ secrets.DEMO_AMOCRM_DOMAIN }}
          DEMO_AMOCRM_TOKEN: ${{ secrets.DEMO_AMOCRM_TOKEN }}
          DEMO_KOMMO_DOMAIN: ${{ secrets.DEMO_KOMMO_DOMAIN }}
          DEMO_KOMMO_TOKEN: ${{ secrets.DEMO_KOMMO_TOKEN }}
          DEMO_B24_WEBHOOK: ${{ secrets.DEMO_B24_WEBHOOK }}
          DEMO_ZOHO_REFRESH_TOKEN: ${{ secrets.DEMO_ZOHO_REFRESH_TOKEN }}
          DEMO_ODOO_URL: ${{ vars.DEMO_ODOO_URL }}
          DEMO_ODOO_DB: ${{ vars.DEMO_ODOO_DB }}
          DEMO_ODOO_LOGIN: ${{ vars.DEMO_ODOO_LOGIN }}
          DEMO_ODOO_KEY: ${{ secrets.DEMO_ODOO_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          VOICE_USD_PER_DAY: ${{ vars.VOICE_USD_PER_DAY }}
          VOICE_STT_MINUTES_PER_DAY: ${{ vars.VOICE_STT_MINUTES_PER_DAY }}
          VOICE_TG_TOKEN: ${{ secrets.VOICE_TG_TOKEN }}
          VOICE_TG_SECRET: ${{ secrets.VOICE_TG_SECRET }}
          VOICE_TG_BOT: ${{ vars.VOICE_TG_BOT }}
          CONTRACTS_USD_PER_DAY: ${{ vars.CONTRACTS_USD_PER_DAY }}
          MAIL_USD_PER_DAY: ${{ vars.MAIL_USD_PER_DAY }}
        run: deploy/ci-deploy.sh stand "$DEPLOY_SHA"
      - name: /health answers with this commit
        run: |
          test "$(curl -fsS --max-time 10 https://apps-stand.alnuzum.com/health | jq -r .version)" = "$DEPLOY_SHA"
    env:
      # the head commit of the pull request, not the merge commit GitHub builds
      DEPLOY_SHA: ${{ github.event.pull_request.head.sha }}

  deploy-prod:
    name: Deploy to production
    needs: [lint, test, compose, gitleaks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: https://apps.alnuzum.com
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build, ship, start
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SECRET_KEYS: ${{ secrets.SECRET_KEYS }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          KOMMO_CLIENT_ID: ${{ vars.KOMMO_CLIENT_ID }}
          KOMMO_CLIENT_SECRET: ${{ secrets.KOMMO_CLIENT_SECRET }}
          ZOHO_CLIENT_ID: ${{ vars.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
          QUOTA_WRITES_PER_DAY: ${{ vars.QUOTA_WRITES_PER_DAY }}
          ANTHROPIC_OAUTH_TOKEN: ${{ secrets.ANTHROPIC_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ORDERS_MODEL_USD_PER_DAY: ${{ vars.ORDERS_MODEL_USD_PER_DAY }}
          ORDERS_MODEL_CALLS_PER_DAY: ${{ vars.ORDERS_MODEL_CALLS_PER_DAY }}
          ORDERS_RUNS_PER_SESSION: ${{ vars.ORDERS_RUNS_PER_SESSION }}
          ORDERS_RUNS_PER_IP: ${{ vars.ORDERS_RUNS_PER_IP }}
          ORDERS_DEMO_WRITES_PER_SESSION: ${{ vars.ORDERS_DEMO_WRITES_PER_SESSION }}
          DEMO_AMOCRM_DOMAIN: ${{ secrets.DEMO_AMOCRM_DOMAIN }}
          DEMO_AMOCRM_TOKEN: ${{ secrets.DEMO_AMOCRM_TOKEN }}
          DEMO_KOMMO_DOMAIN: ${{ secrets.DEMO_KOMMO_DOMAIN }}
          DEMO_KOMMO_TOKEN: ${{ secrets.DEMO_KOMMO_TOKEN }}
          DEMO_B24_WEBHOOK: ${{ secrets.DEMO_B24_WEBHOOK }}
          DEMO_ZOHO_REFRESH_TOKEN: ${{ secrets.DEMO_ZOHO_REFRESH_TOKEN }}
          DEMO_ODOO_URL: ${{ vars.DEMO_ODOO_URL }}
          DEMO_ODOO_DB: ${{ vars.DEMO_ODOO_DB }}
          DEMO_ODOO_LOGIN: ${{ vars.DEMO_ODOO_LOGIN }}
          DEMO_ODOO_KEY: ${{ secrets.DEMO_ODOO_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          VOICE_USD_PER_DAY: ${{ vars.VOICE_USD_PER_DAY }}
          VOICE_STT_MINUTES_PER_DAY: ${{ vars.VOICE_STT_MINUTES_PER_DAY }}
          VOICE_TG_TOKEN: ${{ secrets.VOICE_TG_TOKEN }}
          VOICE_TG_SECRET: ${{ secrets.VOICE_TG_SECRET }}
          VOICE_TG_BOT: ${{ vars.VOICE_TG_BOT }}
          CONTRACTS_USD_PER_DAY: ${{ vars.CONTRACTS_USD_PER_DAY }}
          MAIL_USD_PER_DAY: ${{ vars.MAIL_USD_PER_DAY }}
        run: deploy/ci-deploy.sh prod "$GITHUB_SHA"
      - name: /health answers with this commit
        run: |
          test "$(curl -fsS --max-time 10 https://apps.alnuzum.com/health | jq -r .version)" = "$GITHUB_SHA"

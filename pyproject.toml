[project]
name = "alnuzum-solutions"
version = "0.1.0"
description = "Open-source CRM solutions by Al-Nuzum: shared CRM adapters and platform"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = ["alnuzum-crm", "alnuzum-platform"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
alnuzum-crm = { workspace = true }
alnuzum-platform = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "bandit>=1.8",
    "pip-audit>=2.7",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PT", "RET"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "S107", "S311", "ASYNC210", "E501"]
"scripts/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["alnuzum_crm", "alnuzum_platform"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
mypy_path = ["packages/crm/src", "packages/platform/src"]
explicit_package_bases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["packages/crm/tests", "packages/platform/tests"]
addopts = "--import-mode=importlib -m 'not e2e'"
markers = ["e2e: live calls into real CRM accounts (needs secrets)"]

[tool.coverage.run]
source = ["alnuzum_crm", "alnuzum_platform"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]

[tool.bandit]
exclude_dirs = ["packages/crm/tests", "packages/platform/tests", ".venv"]

[project]
name = "alnuzum-files"
version = "0.1.0"
description = "Files from strangers: what they really are, bounds checked before parsing, heavy parsing in a child process"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "pypdf>=6.0",
    "pillow>=11.0",
    "pypdfium2>=4.30",
    "defusedxml>=0.7.1",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alnuzum_files"]

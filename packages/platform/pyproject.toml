[project]
name = "alnuzum-platform"
version = "0.1.0"
description = "Platform of Al-Nuzum solutions: CRM connections through the browser, sessions, health"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "alnuzum-crm",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "cryptography>=44",
    "pydantic-settings>=2.6",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.20",
]

[project.scripts]
alnuzum-platform = "alnuzum_platform.cli:main"

[tool.uv.sources]
alnuzum-crm = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alnuzum_platform"]

<!doctype html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{% block title %}{{ t.title }}{% endblock %} · Al-Nuzum</title>
<link rel="stylesheet" href="/static/app.css">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
{% block head %}{% endblock %}
</head>
<body>
<svg class="sprite" aria-hidden="true">
  <symbol id="brk-l" viewBox="0 0 9 24"><path d="M8 1.6H3.4A1.4 1.4 0 0 0 2 3v18a1.4 1.4 0 0 0 1.4 1.4H8" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="brk-r" viewBox="0 0 9 24"><path d="M1 1.6h4.6A1.4 1.4 0 0 1 7 3v18a1.4 1.4 0 0 1-1.4 1.4H1" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="gh" viewBox="0 0 16 16"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></symbol>
  <symbol id="c-amocrm" viewBox="0 0 20 20"><circle cx="9" cy="11.2" r="5" fill="none" stroke="currentColor" stroke-width="2.3"/><path d="M14 6.2v10.3" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/></symbol>
  <symbol id="c-kommo" viewBox="0 0 20 20"><path d="M5.5 4v12M14.5 4.5 7.6 10l7.4 5.5" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="c-bitrix24" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7.4" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M10 5.7v4.6l3.1 1.9" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="c-zoho" viewBox="0 0 20 20"><path d="M5 5.2h10L5 14.8h10" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="c-odoo" viewBox="0 0 20 20"><circle cx="6" cy="10" r="3.6" fill="none" stroke="currentColor" stroke-width="2.2"/><circle cx="14" cy="10" r="3.6" fill="none" stroke="currentColor" stroke-width="2.2"/></symbol>
  <symbol id="i-ext" viewBox="0 0 24 24"><path d="M8 16 16.5 7.5M9.5 7.5h7v7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-arr" viewBox="0 0 24 24"><path d="M4 12h15m0 0-5.5-5.5M19 12l-5.5 5.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="9.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8.3 10.5V8a3.7 3.7 0 0 1 7.4 0v2.5" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
  <symbol id="i-warn" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M12 7.6v5.4" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/><circle cx="12" cy="16.4" r="1.2" fill="currentColor"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.6 4.4 4.3L19 7.4" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>
<div class="room">
 <div class="in">
  <header class="top">
    <a class="brand-lock" href="/{{ lang }}" dir="ltr"><svg class="brk" aria-hidden="true"><use href="#brk-l"/></svg><span>Al-Nuzum</span><svg class="brk" aria-hidden="true"><use href="#brk-r"/></svg></a>
    <span class="crumb">{{ t.crumb }}{% if env == "stand" %} <b class="badge">{{ t.stand }}</b>{% endif %}</span>
    <nav class="nav">
      <a class="lang" href="/{{ other }}{{ path[3:] if path[:4] == '/' ~ lang ~ '/' else '' }}" hreflang="{{ other }}">{{ t.other_lang }}</a>
      <a class="gh" href="https://github.com/alnuzum/solutions"><svg class="ic" aria-hidden="true"><use href="#gh"/></svg><span>{{ t.github }}</span></a>
    </nav>
  </header>
  {% block body %}{% endblock %}
 </div>
</div>
</body>
</html>

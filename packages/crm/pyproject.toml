[project]
name = "alnuzum-crm"
version = "0.1.0"
description = "One async interface over amoCRM, Kommo, Bitrix24, Zoho CRM and Odoo"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = ["httpx>=0.28"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alnuzum_crm"]

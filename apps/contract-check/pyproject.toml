[project]
name = "alnuzum-contracts"
version = "0.1.0"
description = "Al-Nuzum open solution: a counterparty's draft of a contract against your own standard, changed clauses with quotes and risk, a note and a task for the lawyer in the CRM deal"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "alnuzum-crm",
    "alnuzum-platform",
    "alnuzum-files",
    "alnuzum-orders",
    "anthropic>=2.6",
]

[project.entry-points."alnuzum.solutions"]
contracts = "alnuzum_contracts.web:solution"

[tool.uv.sources]
alnuzum-crm = { workspace = true }
alnuzum-platform = { workspace = true }
alnuzum-files = { workspace = true }
alnuzum-orders = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alnuzum_contracts"]

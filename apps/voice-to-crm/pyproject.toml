[project]
name = "alnuzum-voice"
version = "0.1.0"
description = "Al-Nuzum open solution: a manager's voice note (Russian or Uzbek) becomes confirmed changes of a CRM deal"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "alnuzum-crm",
    "alnuzum-platform",
    "alnuzum-orders",
    "anthropic>=2.6",
    "httpx>=0.28",
    "av>=14",
]

[project.entry-points."alnuzum.solutions"]
voice = "alnuzum_voice.web:solution"

[tool.uv.sources]
alnuzum-crm = { workspace = true }
alnuzum-platform = { workspace = true }
alnuzum-orders = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alnuzum_voice"]

# One environment of the platform (prod or stand): `docker compose -p apps-<env> --env-file /srv/apps/<env>/.env`.
# Installed by an administrator; deploys only change IMAGE_TAG and the settings in .env. The platform gets the
# whole .env (env_file), so a new setting reaches it without touching this file; `environment` below wins over
# it and keeps the defaults.
services:
  db:
    image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    restart: unless-stopped
    environment:
      POSTGRES_USER: alnuzum
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: alnuzum
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alnuzum -d alnuzum"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]
    labels:
      alnuzum.autoheal: "true"
    mem_limit: 384m

  platform:
    image: alnuzum/platform-${APP_ENV:?}:${IMAGE_TAG:?}
    restart: unless-stopped
    env_file: ["/srv/apps/${APP_ENV:?}/.env"]
    environment:
      DATABASE_URL: postgresql+asyncpg://alnuzum:${POSTGRES_PASSWORD}@db:5432/alnuzum
      SECRET_KEYS: ${SECRET_KEYS:?}
      SESSION_SECRET: ${SESSION_SECRET:?}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      APP_ENV: ${APP_ENV:?}
      APP_VERSION: ${IMAGE_TAG}
      PUBLIC_URL: ${PUBLIC_URL:?}
      KOMMO_CLIENT_ID: ${KOMMO_CLIENT_ID:-}
      KOMMO_CLIENT_SECRET: ${KOMMO_CLIENT_SECRET:-}
      ZOHO_CLIENT_ID: ${ZOHO_CLIENT_ID:-}
      ZOHO_CLIENT_SECRET: ${ZOHO_CLIENT_SECRET:-}
      QUOTA_WRITES_PER_DAY: ${QUOTA_WRITES_PER_DAY:-20}
      # the model: the subscription token first, the key for what it refuses (all three solutions); the
      # order-to-deal solution's money ceiling, the demo CRM accounts
      ANTHROPIC_OAUTH_TOKEN: ${ANTHROPIC_OAUTH_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ORDERS_MODEL_USD_PER_DAY: ${ORDERS_MODEL_USD_PER_DAY:-1.5}
      ORDERS_MODEL_CALLS_PER_DAY: ${ORDERS_MODEL_CALLS_PER_DAY:-100}
      ORDERS_RUNS_PER_SESSION: ${ORDERS_RUNS_PER_SESSION:-10}
      ORDERS_RUNS_PER_IP: ${ORDERS_RUNS_PER_IP:-20}
      ORDERS_DEMO_WRITES_PER_SESSION: ${ORDERS_DEMO_WRITES_PER_SESSION:-5}
      DEMO_AMOCRM_DOMAIN: ${DEMO_AMOCRM_DOMAIN:-}
      DEMO_AMOCRM_TOKEN: ${DEMO_AMOCRM_TOKEN:-}
      DEMO_KOMMO_DOMAIN: ${DEMO_KOMMO_DOMAIN:-}
      DEMO_KOMMO_TOKEN: ${DEMO_KOMMO_TOKEN:-}
      DEMO_B24_WEBHOOK: ${DEMO_B24_WEBHOOK:-}
      DEMO_ZOHO_REFRESH_TOKEN: ${DEMO_ZOHO_REFRESH_TOKEN:-}
      DEMO_ODOO_URL: ${DEMO_ODOO_URL:-}
      DEMO_ODOO_DB: ${DEMO_ODOO_DB:-}
      DEMO_ODOO_LOGIN: ${DEMO_ODOO_LOGIN:-}
      DEMO_ODOO_KEY: ${DEMO_ODOO_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      internal: {}
      edge:
        aliases: ["platform-${APP_ENV}"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    labels:
      alnuzum.autoheal: "true"
    mem_limit: 512m

volumes:
  db: {}

networks:
  internal:
    internal: true
  edge:
    name: edge-${APP_ENV}
    external: true

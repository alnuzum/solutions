# One environment of the platform (prod or stand): `docker compose -p apps-<env> --env-file /srv/apps/<env>/.env`.
# Installed by an administrator; deploys only change IMAGE_TAG and the secrets in .env.
services:
  db:
    image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    restart: unless-stopped
    environment:
      POSTGRES_USER: alnuzum
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: alnuzum
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alnuzum -d alnuzum"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]
    labels:
      alnuzum.autoheal: "true"
    mem_limit: 384m

  platform:
    image: alnuzum/platform-${APP_ENV:?}:${IMAGE_TAG:?}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://alnuzum:${POSTGRES_PASSWORD}@db:5432/alnuzum
      SECRET_KEYS: ${SECRET_KEYS:?}
      SESSION_SECRET: ${SESSION_SECRET:?}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      APP_ENV: ${APP_ENV:?}
      APP_VERSION: ${IMAGE_TAG}
      PUBLIC_URL: ${PUBLIC_URL:?}
      KOMMO_CLIENT_ID: ${KOMMO_CLIENT_ID:-}
      KOMMO_CLIENT_SECRET: ${KOMMO_CLIENT_SECRET:-}
      ZOHO_CLIENT_ID: ${ZOHO_CLIENT_ID:-}
      ZOHO_CLIENT_SECRET: ${ZOHO_CLIENT_SECRET:-}
      QUOTA_WRITES_PER_DAY: ${QUOTA_WRITES_PER_DAY:-20}
    depends_on:
      db:
        condition: service_healthy
    networks:
      internal: {}
      edge:
        aliases: ["platform-${APP_ENV}"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    labels:
      alnuzum.autoheal: "true"
    mem_limit: 512m

volumes:
  db: {}

networks:
  internal:
    internal: true
  edge:
    name: edge-${APP_ENV}
    external: true

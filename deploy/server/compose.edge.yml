# Caddy in front of both environments and the test Odoo: `docker compose -p edge -f compose.edge.yml`.
services:
  caddy:
    image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - data:/data
      - config:/config
      - /var/log/caddy:/var/log/caddy
    networks:
      # the published ports go to Caddy over this network: with an IPv6 address of its own Caddy gets a
      # visitor's IPv6 address as it is (without one, docker-proxy hands every IPv6 visitor over from the
      # network's gateway, and the quotas by address would see one visitor)
      edge-v6: { gw_priority: 1 }
      edge-prod: {}
      edge-stand: {}
      edge-odoo: {}
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m

volumes:
  data: {}
  config: {}

networks:
  edge-prod: { external: true }
  edge-stand: { external: true }
  edge-odoo: { external: true }
  edge-v6: { external: true }

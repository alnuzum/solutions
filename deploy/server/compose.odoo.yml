# Test Odoo Community behind Caddy (odoo-e2e.alnuzum.com): `docker compose -p odoo-e2e -f compose.odoo.yml`.
# Database manager is off, the only database is `e2e`.
services:
  db:
    image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    restart: unless-stopped
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${ODOO_DB_PASSWORD:?}
      POSTGRES_DB: postgres
    volumes: [db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]
    mem_limit: 384m
  odoo:
    image: odoo:19.0-20261102@sha256:5e755c725b3c43cf0be16d579904e1418300db3a2c44952f928eaddbcb0cc16d
    restart: unless-stopped
    # The image's entrypoint passes the database password as a command-line argument, which every
    # process on the host sees; odoo itself reads it from /srv/apps/odoo/odoo.conf (0600, owner = the
    # image's odoo user) instead. A shell: `docker compose ... run --rm odoo shell -c /etc/odoo/odoo.conf`.
    entrypoint: ["odoo"]
    command: ["--config=/etc/odoo/odoo.conf", "--database=e2e", "--db-filter=^e2e$$", "--no-database-list", "--proxy-mode"]
    depends_on:
      db: { condition: service_healthy }
    volumes:
      - data:/var/lib/odoo
      - /srv/apps/odoo/odoo.conf:/etc/odoo/odoo.conf:ro
    networks:
      internal: {}
      edge: { aliases: [odoo] }
    mem_limit: 1g
volumes:
  db: {}
  data: {}
networks:
  internal: { internal: true }
  edge: { name: edge-odoo, external: true }

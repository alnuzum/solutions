name: alnuzum-solutions

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: alnuzum
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alnuzum-dev}
      POSTGRES_DB: alnuzum
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alnuzum -d alnuzum"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:${DB_PORT:-55440}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  platform:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://alnuzum:${POSTGRES_PASSWORD:-alnuzum-dev}@db:5432/alnuzum
      SECRET_KEYS: ${SECRET_KEYS:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PLATFORM_PORT:-8040}:8000"

  # Test Odoo Community for live E2E: docker compose --profile odoo up -d
  odoo-db:
    profiles: ["odoo"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  odoo:
    profiles: ["odoo"]
    image: odoo:19.0-20261102
    environment:
      HOST: odoo-db
      USER: odoo
      PASSWORD: odoo
    depends_on:
      odoo-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ODOO_PORT:-8069}:8069"

volumes:
  db-data:
